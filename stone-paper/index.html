<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Rock Paper Scissors</h1>
        
        <div class="score-board">
            <div class="score">
                <p>You</p>
                <span id="player-score">0</span>
            </div>
            <div class="score">
                <p>Computer</p>
                <span id="computer-score">0</span>
            </div>
        </div>

        <div class="game-area">
            <div class="choices">
                <button class="choice" data-choice="rock">
                    <span class="emoji">✊</span>
                    <span class="choice-text">Rock</span>
                </button>
                <button class="choice" data-choice="paper">
                    <span class="emoji">✋</span>
                    <span class="choice-text">Paper</span>
                </button>
                <button class="choice" data-choice="scissors">
                    <span class="emoji">✌️</span>
                    <span class="choice-text">Scissors</span>
                </button>
            </div>

            <div class="game-status">
                <div class="player-choice">
                    <h3>Your Choice</h3>
                    <div id="player-choice-display" class="choice-display">?</div>
                </div>
                <div class="result">
                    <h2 id="result-text">Choose your move!</h2>
                </div>
                <div class="computer-choice">
                    <h3>Computer's Choice</h3>
                    <div id="computer-choice-display" class="choice-display">?</div>
                </div>
            </div>
        </div>

        <button id="reset-button" class="reset-button">Reset Game</button>
    </div>
    <script type="module" src="js/main.js"></script>
  

</body>
</html>
